name: 공공데이터 식당 가져오기

on:
  workflow_dispatch:
  push:
    branches: [import-public-data]
    paths: [scripts/import_public.py, .github/workflows/import-public.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 상가(상권)정보 내려받아 합치기
        run: python scripts/import_public.py
      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet data/; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "공공데이터 식당 목록 갱신"
          git push origin HEAD:${GITHUB_REF_NAME}
