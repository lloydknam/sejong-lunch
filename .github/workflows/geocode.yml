name: 식당 위치 찾기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/places.json]

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 카카오 로컬 API로 위치 찾기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/geocode.py
      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet data/places.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          git commit -m "식당 위치 업데이트"
          git push
