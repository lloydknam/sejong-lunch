<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맛집지도</title>
<link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#E9F8FF">
<meta name="description" content="여의도와 세종청사에서 동료들이 다녀온 식당을 함께 모으고 평가하는 맛집지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
/* Layout: one phone-width column — lunch-countdown header, meal-ticket picker, real map, filter chips, then the shared list. */
:root{
  --bg:#E9F8FF;--surface:#ffffff;--line:#CDE7F5;--fg:#2A1E5C;--muted:#57527A;
  --ink:#DF2F24;--ink-fg:#ffffff;--ticket:#FFE45C;--ticket-fg:#2A1E5C;--ticket-line:#D9A900;
  --good:#00806E;--warn:#A85F00;--bad:#CF2A20;--chip:#D8F1FF;--mint:#00B8A0;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:var(--f-body);
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}

header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--f-display);font-size:29px;line-height:1;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:5px}
.brand h1 img{display:block;width:29px;height:29px;flex:none}
.clock{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface);font-size:11px;white-space:nowrap}
.clock b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.clock[data-s="on"] .dot{background:var(--good)}
.clock[data-s="soon"] .dot{background:var(--warn)}

.regions{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--surface);border-radius:999px;box-shadow:inset 0 0 0 2px var(--fg)}
.regions button{appearance:none;border:0;background:none;border-radius:999px;padding:3px 8px;font-family:var(--f-display);font-size:15px;cursor:pointer;color:var(--fg)}
.regions button[aria-pressed="true"]{background:var(--fg);color:#fff}
.themes{display:flex;flex-wrap:wrap;gap:5px}
.theme{appearance:none;flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 7px;border:1.5px solid var(--fg);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.theme img{width:16px;height:16px;flex:none}
.theme span{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.theme b{font-family:var(--f-display);font-weight:400;font-size:12px;line-height:1.2}
.theme small{font-size:10px;color:var(--muted)}
.theme[aria-pressed="true"]{background:var(--ticket)}
.theme[aria-pressed="true"] small{color:var(--fg)}
.tdesc{flex:1 0 100%;margin:0;font-size:11px;line-height:1.35;color:var(--muted)}
@media (max-width:350px){.theme{padding:3px 5px}.theme img{width:13px;height:13px}.theme b{font-size:11px}.theme small{font-size:9px}}

.ticket{position:relative;display:grid;grid-template-columns:32px 1fr;background:var(--ticket);color:var(--ticket-fg);border:2px solid var(--fg);border-radius:12px;min-height:84px;box-shadow:3px 3px 0 var(--fg)}
.ticket[data-kind="badge"]{background:#FFD23F}
.ticket[data-kind="stock"]{background:#BDEBFF}
.ticket[data-kind="pick"]{background:#FFE45C}
.ticket::before,.ticket::after{content:"";position:absolute;left:32px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
.ticket::before{top:-7px;clip-path:inset(50% 0 0 0)}.ticket::after{bottom:-7px;clip-path:inset(0 0 50% 0)}
.stub{border-right:2px dashed var(--ticket-line);padding:4px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.stub .k{font-family:var(--f-display);font-size:13px;writing-mode:vertical-rl;letter-spacing:.06em}
.stub .d{display:none}
.tmain{padding:6px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tlabel{font-size:10px;font-weight:600;opacity:.75}
.tname{font-family:var(--f-display);font-size:20px;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.tmeta{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.btn{appearance:none;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--ink-fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
/* 종이 식권 한 장: 세 칸이 절취선으로 이어져 있고, 칸마다 다른 색 종이에 한 가지 잉크로 인쇄 */
.coupons{display:grid;grid-template-columns:repeat(3,1fr);filter:drop-shadow(0 2px 2px rgba(42,30,92,.28))}
.coupons.one{grid-template-columns:1fr}
.coupon{appearance:none;position:relative;display:block;padding:4px;border:0;border-radius:0;background:var(--paper);color:var(--print);cursor:pointer;text-align:center;
  transition:transform .12s ease;transform-origin:50% 0}
.coupon:first-child{border-radius:6px 0 0 6px}
.coupon:last-child{border-radius:0 6px 6px 0}
.coupon:only-child{border-radius:6px}
.coupon+.coupon{background-image:linear-gradient(var(--bg) 50%,transparent 50%);background-size:2px 8px;background-repeat:repeat-y;background-position:0 0}
.coupon+.coupon::before,.coupon+.coupon::after{content:"";position:absolute;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--bg);z-index:1}
.coupon+.coupon::before{top:-5px}.coupon+.coupon::after{bottom:-5px}
.coupon[data-kind="pick"]{--paper:#FFE3DC;--print:#A61E15}
.coupon[data-kind="badge"]{--paper:#FFF1B8;--print:#6E4A00}
.coupon[data-kind="stock"]{--paper:#D8F0FF;--print:#124A82}
.cframe{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;height:100%;padding:2px 4px 3px;border:3px double var(--print);border-radius:2px}
.cno{align-self:stretch;display:flex;justify-content:space-between;font-size:9px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ckan{align-self:flex-start;margin-left:3px;font-family:"Noto Serif KR",serif;font-weight:900;font-size:18px;line-height:1.2;letter-spacing:.04em}
.cname{font-family:var(--f-display);font-size:13px;line-height:1.2;white-space:nowrap}
.cseal{position:absolute;right:5px;top:15px;width:20px;height:20px;transform:rotate(-14deg)}
.coupon:disabled{cursor:default}
.coupons.drawing .coupon:not(.torn){opacity:.55}
.coupon.torn{transform:translateY(3px) rotate(-1.6deg)}
.coupon:active:not(:disabled){transform:translateY(2px)}
@media (max-width:350px){.ckan{font-size:16px;margin-left:1px}.cname{font-size:12px}.cseal{width:18px;height:18px;right:3px}.cno{font-size:8px}}
.coupons.one .ckan{align-self:center;margin-left:0}
.ticket a{color:var(--ticket-fg);font-weight:600;font-size:12px}
.ticket .links{gap:10px}
.shuffle .tname{opacity:.6}
.ticket.won .tname{animation:pop .32s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.86)}to{transform:scale(1)}}

.mapbox{display:flex;flex-direction:column;gap:4px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mhead h2,.lhead h2{font-family:var(--f-display);font-size:17px}
.mnote{font-size:11px;color:var(--muted)}
#map{height:300px;border-radius:12px;border:2px solid var(--fg);background:#f2efe9;color:#1b2420;z-index:0}
.mkicon img{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(42,30,92,.45))}
.mkicon.approx img{opacity:.55}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:10px 12px}
.pop b{display:block;font-size:14px}
.pop .m{color:#5c6862}
.pop button{margin-top:6px;border:0;background:#DF2F24;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.gov{display:inline-block;transform:translate(-50%,-50%);background:#2A1E5C;color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.filters{display:flex;flex-direction:column;gap:5px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 36px 5px 34px;font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:var(--chip);color:var(--muted);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}
.search input::-webkit-search-cancel-button{display:none}
.frow{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.frow .fl{font-size:11px;color:var(--muted);width:26px;flex:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 7px;font-size:11px;line-height:1.5;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}

.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--fg);border-radius:16px;padding:0 12px;overflow:hidden}
.place{border-bottom:1px solid var(--line)}
.more{margin:14px auto;display:block}
.place.hl{background:color-mix(in srgb,var(--ticket) 14%,transparent)}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 2px;width:100%;text-align:left;background:none;border:0;cursor:pointer}
.pname{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.pmeta{grid-column:1;color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap}
.score{grid-row:1/span 2;grid-column:2;align-self:center;display:flex;gap:6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.score span{padding:2px 6px;border-radius:4px;background:var(--chip)}
.score .g{color:var(--good)}.score .b{color:var(--bad)}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.unv{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.tag.ok{color:var(--good);border-color:var(--good)}
.tag.pick{color:var(--ticket-fg);background:var(--ticket);border-color:var(--ticket-line)}
.tag.th{display:inline-flex;align-items:center;gap:3px;color:var(--fg);border-color:var(--fg);background:var(--surface)}
.tag.th img{width:13px;height:13px}
.why{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px}
.why img{width:20px;height:20px;flex:none;margin-top:1px}
.rvwrap{position:relative;border-radius:10px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.rvview{width:100%;height:220px}
.rvcap{position:absolute;left:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;pointer-events:none}
.rvmsg{padding:14px 12px;font-size:13px;color:var(--muted)}
.detail{padding:0 2px 18px;display:flex;flex-direction:column;gap:12px}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:baseline}
.note{margin:0;font-size:14px}
.reviews{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rv{font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vd{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip);flex:none}
.vd.again{color:var(--good)}.vd.no{color:var(--bad)}
.who{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--bad)}

form{display:flex;flex-direction:column;gap:10px}
.rform{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--bg)}
.seg input{accent-color:var(--ink)}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.addbox{background:var(--surface);border:2px solid var(--fg);border-radius:16px;padding:16px}
.addbox h3{font-family:var(--f-display);font-size:20px;margin-bottom:4px}
.empty{padding:28px 4px;color:var(--muted);font-size:14px;text-align:center}
.banner{font-size:13px;color:var(--fg);background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.banner .row{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:1000}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
footer{font-size:12px;color:var(--muted);text-align:center}
.lab{align-self:center;display:inline-flex;line-height:0;margin-top:-6px}
.lab img{display:block;height:40px;width:auto;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><img src="assets/icons/logo.svg" alt="" width="29" height="29">맛집지도</h1>
    </div>
    <div class="clock" id="clock" data-s="off"><span class="dot"></span><span id="clockText">점심시간 확인 중</span></div>
  </header>

  <nav class="regions" id="regions" aria-label="지역 선택"></nav>

  <section class="coupons" id="coupons" aria-label="뽑기 식권"></section>

  <section class="ticket" id="ticket" data-kind="pick" aria-live="polite">
    <div class="stub"><span class="k">맛집 뽑기</span><span class="d" id="tdate"></span></div>
    <div class="tmain">
      <span class="tlabel" id="tlabel">오늘 뭐 먹지</span>
      <div class="tname" id="tname">식권을 고르세요</div>
      <div class="tmeta" id="tmeta">위 식권을 누르면 한 곳을 뽑아드려요.</div>
      <div class="trow"><span id="tlinks" class="links"></span></div>
    </div>
  </section>

  <section class="mapbox" aria-label="지도">
    <div class="mhead"><h2>지도</h2><span class="mnote" id="mapNote">점을 누르면 식당 정보가 떠요</span></div>
    <div id="map"></div>
    <div class="legend"><span><i style="background:#00A08C"></i>맛집 후보</span><span class="th-only"><img src="assets/icons/badge.svg" alt="" width="13" height="13" style="vertical-align:-2px;margin-right:4px">금배지</span><span class="th-only"><img src="assets/icons/stock.svg" alt="" width="13" height="13" style="vertical-align:-2px;margin-right:4px">증권맨</span><span><i style="background:#8A87A3;width:7px;height:7px"></i>그 밖의 식당</span><span><i style="border:2px dashed var(--muted)"></i>동네 안 대략 위치</span></div>
  </section>

  <section class="themes" id="themes" aria-label="테마 메뉴" hidden></section>

  <div class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input type="search" id="q" placeholder="식당 이름으로 찾기" aria-label="식당 이름으로 찾기" autocomplete="off" enterkeyhint="search">
    <button type="button" id="qClear" aria-label="검색어 지우기" hidden>×</button>
  </div>

  <section class="filters" aria-label="조건">
    <div class="frow" id="fArea"><span class="fl">동네</span></div>
    <div class="frow" id="fCat"><span class="fl">종류</span></div>
    <div class="frow" id="fPrice"><span class="fl">가격</span></div>
    <div class="frow" id="fEtc"><span class="fl">기타</span></div>
  </section>

  <div id="modeBanner" class="banner" hidden></div>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="lhead">
      <h2>모아둔 곳</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"><div class="empty">목록을 불러오는 중이에요.</div></div>
  </section>

  <section class="addbox" id="addbox">
    <h3>새 식당 등록</h3>
    <p style="margin:0 0 10px;color:var(--muted);font-size:13px" id="addHint">다녀온 곳을 올려주세요. 등록하면 같이 쓰는 모두에게 보여요.</p>
    <form id="addForm" autocomplete="off">
      <label class="field"><span>식당 이름</span><input type="text" id="aName" maxlength="40" required placeholder="예: 동동칼국수"></label>
      <div class="grid2">
        <label class="field"><span>동네</span><select id="aArea"></select></label>
        <label class="field"><span>종류</span><select id="aCat"></select></label>
      </div>
      <div class="grid2">
        <label class="field"><span>1인 가격대</span><select id="aPrice"><option value="">모름</option></select></label>
        <label class="field"><span>주소나 건물 (선택)</span><input type="text" id="aAddr" maxlength="60" placeholder="예: 세종1번가 2층"></label>
      </div>
      <div class="seg">
        <label><input type="checkbox" id="aSolo"> 혼밥 가능</label>
        <label><input type="checkbox" id="aGroup"> 단체석</label>
        <label><input type="checkbox" id="aReserve"> 예약 필수</label>
      </div>
      <label class="field"><span>한 줄 메모 (선택)</span><input type="text" id="aNote" maxlength="60" placeholder="예: 11시 50분 전에 가야 자리 있음"></label>
      <label class="field"><span>내 이름이나 별명</span><input type="text" id="aNick" maxlength="20" placeholder="예: 예산실 김사무관"></label>
      <div><button class="btn" type="submit" id="aSubmit">등록하기</button></div>
    </form>
  </section>

  <footer>지도 © OpenStreetMap 기여자 · 식당 정보는 동료들이 올린 내용과 소상공인시장진흥공단 상가(상권)정보예요</footer>

<script>
(function(){

const CATS=["한식","일식","중식","양식","아시아","분식","고기","해산물","카페·빵","기타"];

const REGIONS={
  yeouido:{id:"yeouido",label:"여의도",seed:"data/yeouido.json",prefix:"여의도 ",addrHint:"예: IFC몰 지하 2층",
    areas:["국회·서여의도","여의도역·IFC","증권가","여의나루","샛강·63","기타"],

    center:{"어진동":[36.503,127.258],"도담동":[36.514,127.257],"아름동":[36.517,127.243],"종촌동":[36.505,127.239],"고운동":[36.512,127.225],"나성동":[36.490,127.264],"다정동":[36.495,127.243],"새롬동":[36.485,127.249],"한솔동":[36.481,127.256],"대평동":[36.470,127.272],"보람동":[36.478,127.290],"소담동":[36.480,127.305],"반곡동":[36.497,127.313],"집현동":[36.513,127.310],"조치원읍":[36.601,127.298],"금남면":[36.462,127.285],"장군면":[36.507,127.198]},
    jitter:[.006,.008],bounds:[[36.468,127.222],[36.522,127.318]],themes:["pick"],

};
const THEMES={
  pick:{label:"맛집",tag:"맛집",icon:"assets/icons/pick.svg",desc:"블로그·리뷰·기사에서 모은 맛집 후보예요. 금배지·증권맨 식당도 함께 보여요."},
  badge:{label:"금배지 단골집",coupon:"금배지 뽑기",tag:"금배지",won:"금배지 단골집 당첨",icon:"assets/icons/badge.svg",color:"#E0A400",desc:"국회의원 정치자금 지출 자료와 보도에 나온 곳이에요."},
  stock:{label:"증권맨 맛집",coupon:"증권맨 뽑기",tag:"증권맨",won:"증권맨 맛집 당첨",icon:"assets/icons/stock.svg",color:"#DF2F24",desc:"증권가 직장인 추천 글과 증권맨 소개 기사에 나온 곳이에요."}
};
const DEFAULT_REGION="yeouido";
/* 지역 표시가 없는 예전 자료는 세종 것이에요 */

const $=id=>document.getElementById(id);
const PAGE=60;
const S={limit:PAGE,q:"",places:[],reviews:[],f:{},open:null,picked:null,confirmDel:null,me:null,loaded:false,needPass:false,error:""};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function el(tag,attrs,...kids){const n=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")n.className=v;else if(k==="text")n.textContent=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(String(c)))}
  return n}
function toast(t){const n=$("toast");n.textContent=t;n.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>n.hidden=true,2400)}

/* filters are remembered per region; Sejong keeps its original key */
const filterKey=()=>R.id===LEGACY_REGION?"lunchFilter":"lunchFilter:"+R.id;
function loadF(){const f={area:"",cat:"",price:"",solo:false,theme:"",sort:"score",anchor:0};
  try{const s=JSON.parse(store(filterKey())||"null");if(s&&typeof s==="object")Object.assign(f,s)}catch(e){}
  if(!R.areas.includes(f.area))f.area="";if(!R.anchors[f.anchor])f.anchor=0;if(f.pick&&!f.theme)f.theme="pick";delete f.pick;if(!R.themes.includes(f.theme))f.theme="";return f}
const inTheme=(p,k)=>k==="pick"?p.src!=="public":!!p[k];
function saveF(){store(filterKey(),JSON.stringify(S.f))}
const regionOf=p=>p.region||LEGACY_REGION;

/* identity: a random token kept on this phone; the server only ever sees its hash */
let token=store("lunchToken");
if(!token||token.length<16){token=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");store("lunchToken",token)}
async function hashToken(t){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("").slice(0,16)}

/* lunch clock */
function tick(){const d=new Date();const m=d.getHours()*60+d.getMinutes();const day=d.getDay();
  const c=$("clock"),t=$("clockText");const fmt=x=>x>=60?Math.floor(x/60)+"시간 "+(x%60)+"분":x+"분";
  $("tdate").textContent=(d.getMonth()+1)+"."+String(d.getDate()).padStart(2,"0")+" "+["일","월","화","수","목","금","토"][day];
  t.textContent="";
  if(day===0||day===6){c.dataset.s="off";t.append("주말이에요");return}
  if(m<720){c.dataset.s=720-m<=30?"soon":"off";t.append("점심까지 ",el("b",{text:fmt(720-m)}))}
  else if(m<780){c.dataset.s="on";t.append("점심시간 · ",el("b",{text:fmt(780-m)})," 남음")}
  else{c.dataset.s="off";t.append("오늘 점심 끝 · 내일 12:00")}}
tick();setInterval(tick,30000);

/* geometry */
function seedHash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
function pos(p){if(typeof p.lat==="number"&&typeof p.lng==="number"&&p.lat)return{ll:[p.lat,p.lng],exact:true};
  const c=R.center[p.area];if(!c)return null;const h=seedHash(p.id);
  return{ll:[c[0]+((h%100)/100-.5)*R.jitter[0],c[1]+(((h>>7)%100)/100-.5)*R.jitter[1]],exact:false}}
function distKm(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r;
  const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const anchor=()=>R.anchors[S.f.anchor]||R.anchors[0];
function govDist(p){const q=pos(p);return q&&q.exact?distKm(anchor().ll,q.ll):null}
/* for ordering only: an approximate spot still beats no order at all */
function sortDist(p){const q=pos(p);return q?distKm(anchor().ll,q.ll):99}
function fmtKm(k){return k<.95?Math.round(k*10)*100+"m":k.toFixed(1)+"km"}

/* data */
const seedCache={};
const seeds=()=>seedCache[R.id]||[];
let loadTicket=0;
async function load(){const t=++loadTicket,r0=R;
  if(!seedCache[r0.id]){try{const r=await fetch(r0.seed,{cache:"no-cache"});if(!r.ok)throw 0;seedCache[r0.id]=(await r.json()).map(p=>({...p,seed:true,region:r0.id}))}
    catch(e){S.error="식당 목록을 불러오지 못했어요."}}
  if(t!==loadTicket)return;
  const failed=S.error;await refresh();if(t!==loadTicket)return;
  if(failed)S.error=failed;S.loaded=true;renderAll()}
async function refresh(){
  if(!API){const loc=readLocal();S.places=seeds().concat(loc.places.filter(p=>regionOf(p)===R.id));S.reviews=loc.reviews;return}
  try{const r=await fetch(API,{cache:"no-cache"});const j=await r.json();
    if(!j.ok)throw 0;S.places=seeds().concat((j.places||[]).filter(p=>regionOf(p)===R.id).map(p=>({...p,user:true})));S.reviews=j.reviews||[];
    S.needPass=!!j.needsPasscode&&!store("lunchPass");S.error=""}
  catch(e){S.places=seeds().slice();S.error="공유 저장소에 연결하지 못했어요. 잠시 뒤 새로고침해 주세요."}}
function readLocal(){try{const j=JSON.parse(store("lunchLocal")||"null");if(j&&Array.isArray(j.places)&&Array.isArray(j.reviews))return j}catch(e){}return{places:[],reviews:[]}}
function writeLocal(j){store("lunchLocal",JSON.stringify(j))}

async function send(action,payload){
  const nick=($("aNick").value||store("lunchNick")||"").trim();
  if(!API){const j=readLocal();const now=Date.now();const id=(action==="addPlace"?"l-":"lr-")+now.toString(36);
    if(action==="addPlace")j.places.push({...payload,id,nick,owner:S.me,createdAt:now,user:true});
    if(action==="addReview")j.reviews.push({...payload,id,nick,owner:S.me,createdAt:now});
    if(action==="deletePlace")j.places=j.places.filter(p=>p.id!==payload.id);
    if(action==="deleteReview")j.reviews=j.reviews.filter(r=>r.id!==payload.id);
    writeLocal(j);await refresh();renderAll();return true}
  const body={action,token,nick,passcode:store("lunchPass")||"",...payload};
  let j;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});j=await r.json()}
  catch(e){toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요");return false}
  if(!j.ok){const m={passcode:"팀 암호가 맞지 않아요. 위에 암호를 넣어주세요",duplicate:"이미 등록된 이름이에요",not_owner:"직접 올린 항목만 지울 수 있어요"};
    if(j.error==="passcode"){store("lunchPass","");S.needPass=true;renderBanner()}
    toast(m[j.error]||"저장하지 못했어요. 잠시 뒤 다시 시도해 주세요");return false}
  await refresh();renderAll();return true}

/* banner */
function renderBanner(){const b=$("modeBanner");b.replaceChildren();
  if(S.error){b.append(S.error);b.hidden=false;return}
  if(!API){b.append("지금은 '내 폰에만 저장' 모드예요. 등록과 평가가 이 기기에만 남아요.");b.hidden=false;return}
  if(S.needPass){const inp=el("input",{type:"password",id:"passIn",placeholder:"팀 암호","aria-label":"팀 암호"});
    b.append("등록과 평가를 하려면 팀 암호가 필요해요.",el("div",{class:"row"},inp,el("button",{class:"btn",type:"button",onclick:()=>{const v=inp.value.trim();if(!v)return;store("lunchPass",v);S.needPass=false;renderBanner();toast("암호를 저장했어요")},text:"확인"})));b.hidden=false;return}
  b.hidden=true}

/* filters */
function chips(box,opts,key){const row=$(box);row.querySelectorAll(".chip").forEach(n=>n.remove());
  [["","전체"],...opts.map(o=>[o,o])].forEach(([v,l])=>row.append(el("button",{class:"chip",type:"button","aria-pressed":String(S.f[key]===v),onclick:()=>{S.f[key]=v;S.limit=PAGE;saveF();renderAll()},text:l})))}
function renderThemes(){const box=$("themes");box.hidden=false;box.replaceChildren();
  document.querySelectorAll(".th-only").forEach(n=>n.hidden=R.themes.length<2);
  R.themes.forEach(k=>{const t=THEMES[k],n=S.places.filter(p=>inTheme(p,k)).length;
    box.append(el("button",{class:"theme",type:"button","aria-pressed":String(S.f.theme===k),onclick:()=>{S.f.theme=S.f.theme===k?"":k;S.limit=PAGE;saveF();if(map){map.closePopup();map.fitBounds(R.bounds)}renderAll()}},
      el("img",{src:t.icon,alt:""}),el("span",null,el("b",{text:t.label}),el("small",{text:n+"곳"}))))});
  if(S.f.theme)box.append(el("p",{class:"tdesc",text:THEMES[S.f.theme].desc}))}
function renderCoupons(){const box=$("coupons");const extra=R.themes.filter(k=>k!=="pick");box.className="coupons"+(extra.length?"":" one");box.replaceChildren();
  const d=new Date(),day=String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  [["pick","맛집 뽑기","assets/icons/pick.svg"],...extra.map(k=>[k,THEMES[k].coupon,THEMES[k].icon])].forEach(([k,l,i],n)=>
    box.append(el("button",{class:"coupon",type:"button","data-kind":k,"aria-label":l,onclick:()=>draw(k)},
      el("span",{class:"cframe"},
        el("span",{class:"cno"},el("span",{text:"No."+day+"-"+(n+1)}),el("span",{text:"1매"})),
        el("span",{class:"ckan",text:"식권"}),
        el("img",{class:"cseal",src:i,alt:""}),
        el("span",{class:"cname",text:l})))))}
function renderFilters(){const used=new Set(S.places.map(p=>p.area));chips("fArea",R.areas.filter(a=>used.has(a)),"area");chips("fCat",CATS,"cat");chips("fPrice",PRICES,"price");
  const r=$("fEtc");r.querySelectorAll(".chip").forEach(n=>n.remove());
  r.append(el("button",{class:"chip",type:"button","aria-pressed":String(!!S.f.solo),onclick:()=>{S.f.solo=!S.f.solo;saveF();renderAll()},text:"혼밥 가능만"}),
    ...R.anchors.map((a,i)=>{const on=S.f.sort==="near"&&S.f.anchor===i;
      return el("button",{class:"chip",type:"button","aria-pressed":String(on),onclick:()=>{S.f.sort=on?"score":"near";S.f.anchor=i;saveF();renderAll()},text:a.short+"에서 가까운 순"})}))}

let rvIndex=null,rvFrom=null;
function stats(id){if(rvFrom!==S.reviews){rvFrom=S.reviews;rvIndex=new Map();for(const r of S.reviews){const a=rvIndex.get(r.placeId);if(a)a.push(r);else rvIndex.set(r.placeId,[r])}}
  const rs=rvIndex.get(id)||[];
  return{rs,again:rs.filter(r=>r.verdict==="again").length,ok:rs.filter(r=>r.verdict==="ok").length,no:rs.filter(r=>r.verdict==="no").length}}
const squash=t=>String(t||"").toLowerCase().replace(/\s+/g,"");
function filtered(ignoreTheme){const q=squash(S.q);const th=ignoreTheme?"":S.f.theme;return S.places.filter(p=>(!th||inTheme(p,th))&&(!q||squash(p.name).includes(q))&&(!S.f.area||p.area===S.f.area)&&(!S.f.cat||p.category===S.f.cat)&&(!S.f.price||p.price===S.f.price)&&(!S.f.solo||p.solo))}
function sorted(list){const rows=list.map(p=>({p,s:stats(p.id),d:govDist(p)}));
  if(S.f.sort==="near")return rows.sort((a,b)=>sortDist(a.p)-sortDist(b.p));
  const rank=S.f.theme==="badge"?(p=>p.badgeRank||99):()=>0;
  return rows.sort((a,b)=>(b.s.again-b.s.no)-(a.s.again-a.s.no)||b.s.rs.length-a.s.rs.length||rank(a.p)-rank(b.p)||(a.p.src==="public")-(b.p.src==="public")||(b.p.createdAt||0)-(a.p.createdAt||0))}
function mapLinks(p,cls){const q=encodeURIComponent(R.prefix+p.name);
  return[el("a",{href:p.kakaoUrl||"https://map.kakao.com/?q="+q,target:"_blank",rel:"noopener",class:cls,text:"카카오맵"}),
    el("a",{href:"https://map.naver.com/p/search/"+q,target:"_blank",rel:"noopener",class:cls,text:"네이버지도"})]}
function metaParts(p){const d=govDist(p);return[p.area,p.category,p.price?(p.price.endsWith("~")?p.price.slice(0,-1)+"원~":p.price+"원"):null,d!=null?anchor().short+"에서 "+fmtKm(d):null].filter(Boolean)}
const mine=o=>o&&o.owner&&S.me&&o.owner===S.me;

/* ticket */
const WON={pick:"오늘의 맛집 당첨"};
function showTicket(p){const T=$("ticket");T.classList.remove("shuffle");
  if(!p){T.dataset.kind="pick";T.classList.remove("won");$("tlabel").textContent="오늘 뭐 먹지";$("tname").textContent="식권을 고르세요";
    $("tmeta").textContent="위 식권을 누르면 한 곳을 뽑아드려요.";$("tlinks").replaceChildren();return}
  const k=S.pickKind||"pick";T.dataset.kind=k;$("tlabel").textContent=WON[k]||THEMES[k].won;$("tname").textContent=p.name;
  const s=stats(p.id);const bits=metaParts(p);if(p.note)bits.push(p.note);if(p.solo)bits.push("혼밥 가능");if(p.reserve)bits.push("예약 필수");
  if(s.rs.length)bits.push("또 갈래 "+s.again+" · 비추 "+s.no);
  $("tmeta").textContent=bits.join(" · ");$("tlinks").replaceChildren(...mapLinks(p))}
function draw(kind){
  const pool=filtered(true).filter(p=>inTheme(p,kind));
  const T=$("ticket"),box=$("coupons"),btns=[...box.querySelectorAll(".coupon")];const clear=()=>{box.classList.remove("drawing");btns.forEach(b=>{b.disabled=false;b.classList.remove("torn")})};T.dataset.kind=kind;T.classList.remove("won");S.picked=null;
  if(!pool.length){showTicket(null);T.dataset.kind=kind;$("tname").textContent="조건에 맞는 곳이 없어요";$("tmeta").textContent="동네나 종류 조건을 하나 풀어보세요.";return}
  const final=pool[Math.floor(Math.random()*pool.length)];
  const r0=R;const done=()=>{clear();if(r0!==R){showTicket(null);return}S.picked=final.id;S.pickKind=kind;showTicket(final);void T.offsetWidth;T.classList.add("won");focusOnMap(final)};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||pool.length<2){done();return}
  T.classList.add("shuffle");$("tlabel").textContent="뽑는 중";$("tlinks").replaceChildren();box.classList.add("drawing");btns.forEach(b=>{b.disabled=true;if(b.dataset.kind===kind)b.classList.add("torn")});
  let i=0;const iv=setInterval(()=>{$("tname").textContent=pool[i++%pool.length].name;$("tmeta").textContent=""},70);
  setTimeout(()=>{clearInterval(iv);done()},650)}

/* map */
let map=null,layer=null,anchorLayer=null;const markers={};
function initMap(){if(!window.L){$("map").replaceChildren(el("div",{class:"empty",text:"지도를 불러오지 못했어요."}));return}
  map=L.map("map",{scrollWheelZoom:false,zoomControl:true,preferCanvas:true}).fitBounds(R.bounds);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  anchorLayer=L.layerGroup().addTo(map);layer=L.layerGroup().addTo(map);drawAnchors()}
function drawAnchors(){if(!map)return;anchorLayer.clearLayers();
  R.anchors.forEach(a=>L.marker(a.ll,{icon:L.divIcon({className:"",html:'<span class="gov">'+a.name+'</span>',iconSize:null,iconAnchor:[0,0]}),interactive:false,keyboard:false}).addTo(anchorLayer))}
function renderMap(){if(!map)return;layer.clearLayers();for(const k in markers)delete markers[k];
  /* 지도는 다크 모드에서도 밝아서 점 색을 고정해요 */
  const ink="#00A08C",muted="#8A87A3",tk="#FF4F3D",good="#00806E",bad="#CF2A20";const theme=S.f.theme;
  let approx=0;const list=filtered(),shown=list.length;
  list.forEach(p=>{const q=pos(p);if(!q)return;if(!q.exact)approx++;const s=stats(p.id);
    const on=S.open===p.id||S.picked===p.id;const col=s.again>s.no?good:s.no>s.again?bad:p.badge?THEMES.badge.color:p.stock?THEMES.stock.color:ink;
    const plain=p.src==="public"&&!s.rs.length;const sz=on?30:shown>60?17:24;
    const m=theme?L.marker(q.ll,{zIndexOffset:on?1000:0,icon:L.divIcon({className:"mkicon"+(q.exact?"":" approx"),html:'<img src="'+THEMES[theme].icon+'" alt="">',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}):L.circleMarker(q.ll,q.exact?{radius:on?9:plain?3.5:6.5,color:"#fff",weight:plain&&!on?.5:1.5,fillColor:on?tk:plain?muted:col,fillOpacity:plain&&!on?.7:.95}
      :{radius:on?9:6,color:on?tk:muted,weight:1.5,dashArray:"3 3",fillColor:on?tk:muted,fillOpacity:on?.9:.15});
    const pop=el("div",{class:"pop"},el("b",{text:p.name}),el("span",{class:"m",text:metaParts(p).join(" · ")+(q.exact?"":" · 위치 대략")}),el("br"),
      el("button",{type:"button",onclick:()=>openInList(p.id),text:"목록에서 보기"}));
    m.bindPopup(pop);m.addTo(layer);markers[p.id]=m});
  $("mapNote").textContent=approx?"점선 원은 동네 안 대략 위치예요":"점을 누르면 식당 정보가 떠요"}
function focusOnMap(p){const q=pos(p);if(!map||!q)return;map.setView(q.ll,Math.max(map.getZoom(),15));renderMap();const m=markers[p.id];if(m)m.openPopup()}
function openInList(id){S.open=id;S.confirmDel=null;const p=S.places.find(x=>x.id===id);
  if(p&&filtered().indexOf(p)<0){S.f.area="";S.f.cat="";S.f.price="";S.f.solo=false;S.f.theme="";saveF();S.q="";$("q").value="";$("qClear").hidden=true}
  renderAll();const n=document.querySelector('[data-pid="'+CSS.escape(id)+'"]');if(n)n.scrollIntoView({behavior:"smooth",block:"center"})}

/* list */
function renderList(){const L2=$("list");
  if(!S.loaded)return;
  const items=sorted(filtered());$("count").textContent=items.length+" / "+S.places.length+"곳";
  if(!S.places.length){L2.replaceChildren(el("div",{class:"empty",text:"아직 등록된 식당이 없어요. 아래에서 첫 번째 곳을 올려주세요."}));return}
  if(!items.length){L2.replaceChildren(el("div",{class:"empty",text:S.q?"'"+S.q+"'(이)라는 이름의 식당이 없어요. 다른 이름으로 찾거나, 아래에서 새로 등록해 주세요.":"조건에 맞는 곳이 없어요. 위 조건을 하나 풀어보세요."}));return}
  const shown=items.slice(0,S.limit);
  const openAt=S.open?items.findIndex(x=>x.p.id===S.open):-1;if(openAt>=S.limit)shown.push(items[openAt]);
  L2.replaceChildren(...shown.map(({p,s})=>{const open=S.open===p.id;
    const tags=[];if(p.solo)tags.push(el("span",{class:"tag",text:"혼밥"}));if(p.group)tags.push(el("span",{class:"tag",text:"단체"}));
    if(p.reserve)tags.push(el("span",{class:"tag",text:"예약"}));
    if(p.src!=="public"&&p.seed)tags.push(el("span",{class:"tag pick",text:"맛집 후보"}));
    for(const k of ["badge","stock"])if(p[k])tags.push(el("span",{class:"tag th"},el("img",{src:THEMES[k].icon,alt:""}),THEMES[k].tag));
    if(p.geo==="public")tags.push(el("span",{class:"tag ok",text:"상가정보 확인"}));
    else if(p.seed&&!s.rs.length)tags.push(el("span",{class:"tag unv",text:"검증 전"}));
    const row=el("button",{class:"prow",type:"button","aria-expanded":String(open),onclick:()=>{S.open=open?null:p.id;S.confirmDel=null;renderAll();if(!open)focusOnMap(p)}},
      el("span",{class:"pname",text:p.name}),
      el("span",{class:"score","aria-label":"또 갈래 "+s.again+", 무난 "+s.ok+", 비추 "+s.no},el("span",{class:"g",text:"+"+s.again}),el("span",{class:"b",text:"−"+s.no})),
      el("span",{class:"pmeta"},metaParts(p).join(" · "),...tags));
    const wrap=el("div",{class:"place"+(open?" hl":""),"data-pid":p.id},row);if(open)wrap.append(detail(p,s));return wrap}));
  if(items.length>S.limit)L2.append(el("button",{class:"btn ghost more",type:"button",onclick:()=>{S.limit+=PAGE*2;renderList()},text:"더 보기 ("+(items.length-S.limit)+"곳 남음)"}))}

function detail(p,s){const d=el("div",{class:"detail"});
  const rvn=roadviewNode(p);if(rvn)d.append(rvn);
  if(p.note)d.append(el("p",{class:"note",text:p.note}));
  for(const k of ["badge","stock"])if(p[k])d.append(el("p",{class:"why"},el("img",{src:THEMES[k].icon,alt:THEMES[k].tag}),el("span",{text:p[k]})));
  d.append(el("div",{class:"links"},...mapLinks(p),(p.publicAddr||p.address)?el("span",{class:"who",text:p.publicAddr||p.address}):null,
    el("span",{class:"who",text:p.src==="public"?"출처 소상공인 상가정보":p.seed?"처음 목록에 들어간 곳":"올린 사람 "+(p.nick||"동료")})));
  if(p.seed&&p.geo!=="public"&&!s.rs.length)d.append(el("div",{class:"banner",text:"검색으로 찾은 곳이라 아직 아무도 확인하지 않았어요. 영업 중인지 지도에서 먼저 확인하세요."}));
  if(s.rs.length)d.append(el("ul",{class:"reviews"},...s.rs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(r=>
    el("li",{class:"rv"},el("span",{class:"vd "+r.verdict,text:VERD[r.verdict]||"평가"}),r.text?el("span",{text:r.text}):null,el("span",{class:"who",text:r.nick||"동료"}),
      mine(r)?el("button",{class:"linkbtn",type:"button",onclick:()=>send("deleteReview",{id:r.id}).then(ok=>ok&&toast("평가를 지웠어요")),text:"삭제"}):null))));
  d.append(reviewForm(p));
  if(mine(p)){
    if(S.confirmDel===p.id)d.append(el("div",{class:"confirm"},"이 식당을 목록에서 지울까요?",
      el("button",{class:"btn",type:"button",onclick:()=>send("deletePlace",{id:p.id}).then(ok=>{if(ok){S.open=null;toast("지웠어요")}}),text:"지우기"}),
      el("button",{class:"btn ghost",type:"button",onclick:()=>{S.confirmDel=null;renderList()},text:"취소"})));
    else d.append(el("div",null,el("button",{class:"linkbtn danger",type:"button",onclick:()=>{S.confirmDel=p.id;renderList()},text:"식당 삭제"})))}
  return d}

const drafts={};
function reviewForm(p){const name="v-"+p.id;const dr=drafts[p.id]||{v:"again",t:""};
  const txt=el("input",{type:"text",id:"rt-"+p.id,maxlength:"80",placeholder:"한 줄 평 (선택) 예: 제육 맛집, 12시 넘으면 대기"});txt.value=dr.t;
  txt.addEventListener("input",()=>{drafts[p.id]={...(drafts[p.id]||dr),t:txt.value}});
  const f=el("form",{class:"rform",id:"rf-"+p.id},
    el("div",{class:"seg"},...Object.entries(VERD).map(([k,l])=>{const r=el("input",{type:"radio",name,value:k,id:"rv-"+p.id+"-"+k,checked:dr.v===k});
      r.addEventListener("change",()=>{drafts[p.id]={...(drafts[p.id]||dr),v:k}});return el("label",null,r,l)})),
    txt,el("div",null,el("button",{class:"btn",type:"submit",text:"평가 남기기"})));
  f.addEventListener("submit",async e=>{e.preventDefault();const btn=f.querySelector("button");btn.disabled=true;
    const v=(f.querySelector("input[name='"+name+"']:checked")||{}).value||"ok";
    const ok=await send("addReview",{placeId:p.id,verdict:v,text:txt.value.trim().slice(0,80)});
    if(ok){delete drafts[p.id];toast("평가를 남겼어요")}else btn.disabled=false});
  return f}

/* kakao roadview: the street-level view in front of the restaurant */
let kakaoP=null;
function kakaoReady(){if(!KAKAO_JS)return Promise.reject(new Error("nokey"));
  if(kakaoP)return kakaoP;
  kakaoP=new Promise((res,rej)=>{const sc=document.createElement("script");
    sc.src="https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey="+encodeURIComponent(KAKAO_JS);
    sc.onload=()=>{try{kakao.maps.load(()=>res(kakao))}catch(e){rej(e)}};sc.onerror=()=>rej(new Error("load"));
    document.head.appendChild(sc);setTimeout(()=>rej(new Error("timeout")),12000)});
  kakaoP.catch(()=>{kakaoP=null});return kakaoP}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),
  x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);
  return(Math.atan2(y,x)/r+360)%360}
const rvCache={};
function roadviewNode(p){
  if(!KAKAO_JS)return null;
  const q=pos(p);
  if(!q||!q.exact)return el("div",{class:"rvwrap"},el("div",{class:"rvmsg",text:"정확한 위치를 아직 못 찾아서 입구 사진(로드뷰)을 띄울 수 없어요. 카카오맵 링크로 확인해 주세요."}));
  if(rvCache[p.id]){const c=rvCache[p.id];if(c.rv)requestAnimationFrame(()=>c.rv.relayout());return c.node}
  const view=el("div",{class:"rvview"});const msg=el("div",{class:"rvmsg",text:"입구 사진을 불러오는 중이에요."});
  const node=el("div",{class:"rvwrap"},msg);const entry={node,rv:null};rvCache[p.id]=entry;
  kakaoReady().then(k=>{const target=new k.maps.LatLng(q.ll[0],q.ll[1]);
    new k.maps.RoadviewClient().getNearestPanoId(target,60,id=>{
      if(!id){msg.textContent="이 근처에는 로드뷰가 없어요. 건물 안쪽이거나 촬영되지 않은 길이에요.";return}
      node.replaceChildren(view,el("span",{class:"rvcap",text:"카카오 로드뷰 · 드래그해서 둘러보기"}));
      const rv=new k.maps.Roadview(view);entry.rv=rv;
      k.maps.event.addListener(rv,"init",()=>{const at=rv.getPosition();
        rv.setViewpoint({pan:bearing([at.getLat(),at.getLng()],q.ll),tilt:0,zoom:0})});
      rv.setPanoId(id,target)})})
  .catch(()=>{delete rvCache[p.id];msg.textContent="입구 사진(로드뷰)을 불러오지 못했어요. 카카오 키 설정을 확인해 주세요."});
  return node}

/* search */
let qT=null;
$("q").addEventListener("input",()=>{const v=$("q").value;$("qClear").hidden=!v;clearTimeout(qT);qT=setTimeout(()=>{S.q=v.trim();S.limit=PAGE;renderMap();renderList()},120)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("q").blur();const r=filtered();if(r.length===1)openInList(r[0].id)}if(e.key==="Escape"&&$("q").value){$("q").value="";$("q").dispatchEvent(new Event("input"))}});
$("qClear").addEventListener("click",()=>{$("q").value="";$("q").dispatchEvent(new Event("input"));$("q").focus()});

/* add form */
CATS.forEach(a=>$("aCat").append(el("option",{value:a,text:a})));
PRICES.forEach(a=>$("aPrice").append(el("option",{value:a,text:a.endsWith("~")?a.slice(0,-1)+"원~":a+"원"})));
$("aNick").value=store("lunchNick")||"";
$("aNick").addEventListener("change",()=>store("lunchNick",$("aNick").value.trim()));
$("addForm").addEventListener("submit",async e=>{e.preventDefault();
  const name=$("aName").value.trim();if(!name)return;
  if(S.places.some(p=>p.name.replace(/\s/g,"")===name.replace(/\s/g,""))){toast("이미 등록된 이름이에요");return}
  store("lunchNick",$("aNick").value.trim());
  const btn=$("aSubmit");btn.disabled=true;
  const ok=await send("addPlace",{region:R.id,name,area:$("aArea").value,category:$("aCat").value,price:$("aPrice").value,address:$("aAddr").value.trim(),
    solo:$("aSolo").checked,group:$("aGroup").checked,reserve:$("aReserve").checked,note:$("aNote").value.trim()});
  btn.disabled=false;if(ok){$("addForm").reset();$("aNick").value=store("lunchNick")||"";toast("등록했어요")}});

function renderAll(){renderBanner();renderThemes();renderFilters();renderMap();renderList();
  const p=S.picked&&S.places.find(x=>x.id===S.picked);if(p)showTicket(p);else if(!S.picked)showTicket(null)}

/* region switch */
function applyRegion(id){R=REGIONS[id];S.f=loadF();S.places=[];S.open=null;S.picked=null;S.confirmDel=null;S.q="";S.error="";S.loaded=false;S.limit=PAGE;
  store("lunchRegionV2",R.id);
  $("q").value="";$("qClear").hidden=true;
  $("aArea").replaceChildren(...R.areas.map(a=>el("option",{value:a,text:a})));$("aAddr").placeholder=R.addrHint;
  renderCoupons();$("regions").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.r===R.id)));
  try{const u=new URL(location.href);u.searchParams.set("r",R.id);history.replaceState(null,"",u)}catch(e){}}
async function switchRegion(id){if(id===R.id)return;applyRegion(id);
  if(map){map.closePopup();map.fitBounds(R.bounds);drawAnchors()}
  $("count").textContent="";$("list").replaceChildren(el("div",{class:"empty",text:"목록을 불러오는 중이에요."}));
  renderBanner();renderThemes();renderFilters();renderMap();showTicket(null);await load()}
Object.values(REGIONS).forEach(r=>$("regions").append(el("button",{type:"button","data-r":r.id,"aria-pressed":"false",onclick:()=>switchRegion(r.id),text:r.label})));
applyRegion((()=>{let q=null;try{q=new URLSearchParams(location.search).get("r")}catch(e){}
  const c=[q,store("lunchRegionV2")].find(x=>x&&Object.prototype.hasOwnProperty.call(REGIONS,x));return c||DEFAULT_REGION})());

(async()=>{S.me=await hashToken(token).catch(()=>null);initMap();await load();
  if(API)setInterval(()=>{if(document.visibilityState==="visible")refresh().then(renderAll)},60000)})();
})();
